services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activity-log-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - activity-log-network

  nginx:
    image: nginx:1.27-alpine
    container_name: activity-log-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - activity-log-network

  mysql:
    image: mysql:8.0
    container_name: activity-log-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: activity_log
      MYSQL_USER: app
      MYSQL_PASSWORD: app_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - activity-log-network

volumes:
  mysql_data:

networks:
  activity-log-network:
    driver: bridge
